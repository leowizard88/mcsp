backend:
  name: git-gateway
  branch: main

local_backend: true
media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"
publish_mode: editorial_workflow

collections:
  - name: "settings"
    label: "Impostazioni"
    files:
      - label: "Sito"
        name: "site"
        file: "src/_data/site.json"
        fields:
          - { label: "Titolo", name: "title", widget: "string" }
          - { label: "Sottotitolo", name: "subtitle", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }
          - { label: "Email", name: "email", widget: "string" }
      - label: "Homepage"
        name: "home"
        file: "src/_data/home.json"
        fields:
          - { label: "Nota hero", name: "hero_note", widget: "string" }
          - { label: "Titolo call", name: "call_title", widget: "string" }
          - { label: "Testo call", name: "call_text", widget: "text" }
          - { label: "Scadenza call", name: "call_deadline", widget: "string" }
          - { label: "Testo Noi", name: "noi_text", widget: "text" }
          - { label: "Newsletter", name: "newsletter_text", widget: "text" }
  - name: "testi"
    label: "Testi"
    folder: "src/content/testi"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Autore", name: "author", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Tags", name: "tags", widget: "hidden", default: "testi" }
      - { label: "Estratto", name: "excerpt", widget: "text" }
      - { label: "Corpo", name: "body", widget: "markdown" }
  - name: "note"
    label: "Note"
    folder: "src/content/note"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Autore", name: "author", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Tags", name: "tags", widget: "hidden", default: "note" }
      - { label: "Estratto", name: "excerpt", widget: "text" }
      - { label: "Corpo", name: "body", widget: "markdown" }
  - name: "call"
    label: "Call"
    folder: "src/content/call"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Tags", name: "tags", widget: "hidden", default: "call" }
      - { label: "Stato", name: "status", widget: "select", options: ["aperta", "chiusa"] }
      - { label: "Scadenza", name: "deadline", widget: "string" }
      - { label: "Estratto", name: "excerpt", widget: "text" }
      - { label: "Corpo", name: "body", widget: "markdown" }
  - name: "progetti"
    label: "Progetti"
    folder: "src/content/progetti"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Tags", name: "tags", widget: "hidden", default: "progetti" }
      - { label: "Estratto", name: "excerpt", widget: "text" }
      - { label: "Corpo", name: "body", widget: "markdown" }
